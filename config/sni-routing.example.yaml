version: 1

egress:
  warp:
    type: socks
    server: 127.0.0.1
    port: 38886

ingress:
  public_listen: 0.0.0.0:443
  unknown_sni_action: reject

  static_site:
    domain: example.com
    listen_host: 127.0.0.1
    listen_port: 9443
    cert_file: /root/certfile/example.com/fullchain.pem
    key_file: /root/certfile/example.com/key.pem
    web_root: /var/www/html

  reality_backends:
    - name: Ra
      listen_port: 39999
      egress: warp
      user_uuid:
      server: example.com
      servername: sni1.example.com
      handshake_server: sni1.example.com
      port: 443
      private_key:
      public_key:
      short_id:
    - name: Rb
      listen_port: 39998
      user_uuid:
      server: example.com
      servername: sni2.example.com
      handshake_server: sni2.example.com
      port: 443
      private_key:
      public_key:
      short_id:

  trojan_backends:
    - name: T1
      listen_port: 39997
      password: password_example
      server: example.com
      servername: trojan.example.com
      tls_cert_file: /root/certfile/trojan.example.com/fullchain.pem
      tls_key_file: /root/certfile/trojan.example.com/key.pem
      skip_cert_verify: false
      fallback_site:
        enabled: true
        listen_host: 127.0.0.1
        listen_port: 37970
        web_root: /var/www/html

  anytls_backends:
    - name: A1
      listen_port: 39996
      egress: warp
      password: password_example
      server: example.com
      servername: anytls.example.com
      tls_cert_file: /root/certfile/anytls.example.com/fullchain.pem
      tls_key_file: /root/certfile/anytls.example.com/key.pem
      skip_cert_verify: false
      client_fingerprint: chrome
      alpn:
        - h2
        - http/1.1

sing_box:
  socks5_backends:
    - name: S1
      listen_port: 1080
      server: proxy.example.com
      username: socks_user
      password: socks_password

  hy2_backends:
    - name: H1
      listen_host: 0.0.0.0
      listen_port: 443
      egress: warp
      password: password_example
      server: example.com
      servername: hy2.example.com
      tls_cert_file: /root/certfile/hy2.example.com/fullchain.pem
      tls_key_file: /root/certfile/hy2.example.com/key.pem
      skip_cert_verify: false
      masquerade: file:///var/www/html
      up_mbps: 100
      down_mbps: 100
      obfs:
        type: salamander
        password: obfs_password_example
      alpn:
        - h3
